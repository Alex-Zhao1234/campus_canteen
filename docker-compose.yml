# 一条命令跑起整套：docker compose up --build  →  http://localhost
# 变量从项目根目录 .env 读取（compose 自动加载），没有则用这里的默认值。
services:
  api:
    build: ./backend
    volumes:
      - ./data:/app/data            # SQLite + 种子 CSV + 图片，容器重建数据不丢
    environment:
      DATABASE_URL: sqlite+aiosqlite:///../data/canteen.db
      SECRET_KEY: ${SECRET_KEY:-change-me-in-production}
      ALLOWED_EMAIL_DOMAINS: ${ALLOWED_EMAIL_DOMAINS:-edu.cn}
      AUTH_CODE_REQUIRED: ${AUTH_CODE_REQUIRED:-true}   # false = 不发验证码，邮箱直接登录
      AUTH_ECHO_CODE: ${AUTH_ECHO_CODE:-false}     # 需要验证码但没有邮件服务时的开发模式
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost}
      EMBEDDING_BACKEND: none
      SCHEDULER_ENABLED: "true"
      SEED_DEMO_REVIEWS: ${SEED_DEMO_REVIEWS:-false}   # 演示：空库时写入一批演示评价
      RANKING_INTERVAL_MINUTES: ${RANKING_INTERVAL_MINUTES:-10}
    restart: unless-stopped

  web:
    build: ./frontend
    ports:
      - "${WEB_PORT:-80}:80"
    depends_on:
      - api
    restart: unless-stopped
